        <div class="breadcrumb"><a href="legacy-site-home.html">首页</a> &gt; 留言回访</div>
        <div class="page-body">
          <p class="lead">
            欢迎使用槐宁市114旧版留言回访系统。本系统用于查询市民留言处理进度及补充说明。
          </p>
          <div class="y2k-form query-form">
            <label for="q-id">留言编号</label>
            <input
              id="q-id"
              type="text"
              placeholder="HM-YYYYMMDD-0017"
              disabled
            />
            <label for="q-name">称呼</label>
            <input
              id="q-name"
              type="text"
              placeholder="您尚未登记……"
              disabled
            />
            <label for="q-phone">联系方式后三位</label>
            <input id="q-phone" type="text" maxlength="3" disabled />
            <button class="y2k-btn" disabled>查询</button>
          </div>
          <div class="notice-box warn-box">
            <p>⚠ 系统提示：检测到未归档留言指向当前浏览器会话。</p>
            <p>您没有留言编号，但搜索结果显示您有一条等待回拨的留言。</p>
          </div>
          <p class="action-line">
            <a href="message-supplement-form.html" class="y2k-btn primary"
              >没有留言编号？点击补充留言</a
            >
          </p>
          <aside class="side-panel">
            <h4>栏目说明</h4>
            <p>
              114留言回访承诺：夜间留言将于<strong>[[TOMORROW]]</strong>由值班员统一处理。
            </p>
            <p>本页面不验证身份——它默认您已经来过。</p>
          </aside>
