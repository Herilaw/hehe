      <div class="page-body">
        <p class="lead">请填写以下信息。带 <span class="req">*</span> 为必填项。提交后<strong>不可撤回</strong>——本系统不支持删除留言。</p>
        <form class="y2k-form" id="form-message" data-unless-flag="submittedMessage">
          <label for="msg-name">称呼 <span class="req">*</span></label>
          <input id="msg-name" name="name" type="text" placeholder="便于回访的称呼" value="">
          <label for="msg-body">留言内容</label>
          <textarea id="msg-body" name="content" rows="4" placeholder="（可选）请描述您的诉求……"></textarea>
          <label>是否需要回拨</label>
          <p><input type="checkbox" checked disabled> 是 — 夜间留言默认需要回拨</p>
          <p class="fine-print">夜间留言将由明日值班人员统一处理。提交即视为同意《夜间值班回访协议》。</p>
          <button type="submit" class="y2k-btn primary">提交留言</button>
        </form>
        <div class="notice-box" data-if-flag="submittedMessage">
          <p class="status-future">留言已接收。回拨时间：[[TOMORROW]]</p>
        </div>
      </div>
