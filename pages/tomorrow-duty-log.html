        <div class="page-body">
          <h3 class="section-title">明日值班记录 · 生成状态</h3>
          <div class="status-panel">
            <table class="y2k-table status-table">
              <tr>
                <td width="140">当前访客</td>
                <td>
                  <strong data-bind="PLAYER_NAME">[[PLAYER_NAME]]</strong>
                </td>
              </tr>
              <tr>
                <td>当前身份</td>
                <td>
                  <span data-unless-flag="submittedMessage">访客</span
                  ><span data-if-flag="submittedMessage">留言人</span>
                </td>
              </tr>
              <tr>
                <td>明日回拨时间</td>
                <td class="status-future">[[TOMORROW]]</td>
              </tr>
              <tr>
                <td>值班记录状态</td>
                <td id="record-status">未生成</td>
              </tr>
              <tr>
                <td>候选等级</td>
                <td>— → 观察中</td>
              </tr>
            </table>
          </div>
          <div class="notice-box">
            <h4>生成条件（满足任一即继续累积）</h4>
            <ul class="check-list">
              <li id="chk-night">☐ 阅读夜间值班说明</li>
              <li id="chk-nocaller">☐ 查询无人来电说明</li>
              <li id="chk-accident">☐ 查看零点回拨事故记录</li>
              <li id="chk-training">☐ 完成岗前培训（后期激活）</li>
            </ul>
          </div>
          <p class="status-line">系统备注：当前访客尚未登记。</p>
